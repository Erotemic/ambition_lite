name: Headless gameplay tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q src tools tests
      - name: Test physics, enemies, art and adventure without a display
        run: PYTHONPATH=src python -m pytest -q
      - name: Demonstrate headless game
        run: PYTHONPATH=src python -m ambition_lite --headless --frames 120
